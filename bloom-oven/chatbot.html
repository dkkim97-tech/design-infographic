<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom Oven | 24시간 상담봇</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127874;</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .chat-wrap{max-width:820px;margin:0 auto;padding:22px 24px 40px}
    .chat-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
    .chat-title{display:flex;align-items:center;gap:12px}
    .chat-title h1{font-size:30px;color:var(--sage-ink)}
    .chat-title .dot{width:9px;height:9px;border-radius:50%;background:var(--sage);box-shadow:0 0 0 4px rgba(147,182,162,.25)}
    .chat-window{display:flex;flex-direction:column;height:min(64vh,560px);padding:20px;overflow:hidden}
    .chat-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:4px 6px 6px}
    .msg{max-width:80%;padding:12px 16px;border-radius:18px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
    .msg.bot{align-self:flex-start;background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.8);border-bottom-left-radius:6px;box-shadow:var(--shadow-sm);color:var(--ink)}
    .msg.user{align-self:flex-end;color:#fff;border-bottom-right-radius:6px;background:linear-gradient(180deg,var(--sage),var(--sage-deep));box-shadow:0 6px 16px rgba(79,122,99,.32)}
    .msg.typing{color:var(--ink-faint);font-style:italic}
    .quick-replies{display:flex;flex-wrap:wrap;gap:8px;margin:14px 2px 4px}
    .chip{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--sage-ink);cursor:pointer;
      border:1px solid rgba(255,255,255,.75);background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(247,241,232,.55));
      box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 2px 8px rgba(60,54,47,.08);transition:transform .16s,box-shadow .18s}
    .chip:hover{transform:translateY(-1.5px);box-shadow:inset 0 1px 1px rgba(255,255,255,1),0 6px 14px rgba(60,54,47,.14)}
    .chip:active{transform:scale(.96)}
    .chat-input{display:flex;gap:10px;margin-top:14px}
    .chat-input input{flex:1;font-family:inherit;font-size:14.5px;padding:13px 18px;border-radius:999px;
      border:1px solid rgba(79,122,99,.22);background:rgba(255,255,255,.8);outline:none;transition:border-color .18s,box-shadow .18s}
    .chat-input input:focus{border-color:var(--sage-mid);background:#fff;box-shadow:0 0 0 4px rgba(147,182,162,.2)}
    .send-btn{width:52px;height:52px;padding:0;font-size:19px}
    .chat-note{font-size:12.5px;color:var(--ink-faint);margin-top:12px;text-align:center}
    .key-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
    .key-row input{flex:1;min-width:200px;font-family:inherit;font-size:13px;padding:10px 14px;border-radius:12px;border:1px solid rgba(79,122,99,.2);background:rgba(255,255,255,.7);outline:none}
    .key-status{font-size:12px;color:var(--sage-deep);font-weight:700}
    details.key-box{margin-top:14px;border-radius:16px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);overflow:hidden}
    details.key-box summary{cursor:pointer;list-style:none;padding:12px 16px;font-size:13px;font-weight:700;color:var(--sage-ink)}
    details.key-box summary::-webkit-details-marker{display:none}
    details.key-box .key-inner{padding:0 16px 16px}
  </style>
</head>
<body>
  <div class="chat-wrap">
    <div class="chat-top">
      <div class="chat-title">
        <span class="dot"></span>
        <h1>Bloom Oven 상담봇</h1>
      </div>
      <a class="btn btn-secondary btn-sm" href="index.html">← 홈으로</a>
    </div>

    <div class="chat-window glass-panel">
      <div class="chat-log" id="log" aria-live="polite"></div>
      <div class="quick-replies" id="quick"></div>
      <div class="chat-input">
        <input id="input" type="text" placeholder="메시지를 입력하세요 (예: 배송 지역이 어디예요?)" autocomplete="off">
        <button class="btn btn-primary send-btn" id="send" aria-label="보내기">➤</button>
      </div>
    </div>

    <details class="key-box">
      <summary>⚙ OpenAI API 키 설정 (선택) — 더 자연스러운 상담</summary>
      <div class="key-inner">
        <p class="chat-note" style="text-align:left;margin:4px 0 8px">키는 이 브라우저에만 저장되며 서버로 전송되지 않습니다. 미설정 시 FAQ 기반으로 동작합니다.</p>
        <div class="key-row">
          <input id="keyInput" type="password" placeholder="sk-...">
          <button class="btn btn-secondary btn-sm" id="keySave">저장</button>
          <button class="btn btn-ghost btn-sm" id="keyClear">삭제</button>
        </div>
        <p class="key-status" id="keyStatus" style="margin-top:8px"></p>
      </div>
    </details>

    <p class="chat-note">24시간 자동 응답 · 실제 예약 확정은 상담 후 진행됩니다 ✿</p>
  </div>

  <script>
  (function(){
    "use strict";
    var KEY_STORE="bloom_openai_key";
    var log=document.getElementById("log"),
        input=document.getElementById("input"),
        send=document.getElementById("send"),
        quick=document.getElementById("quick");

    /* ---- Knowledge base (FAQ fallback) ---- */
    var BRAND="Bloom Oven는 서울 성동구 서울숲길의 수제 베이커리입니다.";
    var FAQ=[
      {k:["안녕","하이","hello","안녕하세요","반가"],a:"안녕하세요! Bloom Oven 상담봇이에요 ✿ 메뉴, 예약, 배송, 영업시간 무엇이든 물어봐 주세요."},
      {k:["영업","시간","오픈","마감","언제","열","휴무","쉬는"],a:"영업시간 안내예요.\n• 월–금 10:00–19:00\n• 토 11:00–18:00\n• 일 예약 픽업 전용\n• 매주 화요일 정기 휴무\n당일 재고 소진 시 조기 마감될 수 있어요."},
      {k:["위치","어디","주소","오시는","길","매장","서울숲"],a:"매장은 서울시 성동구 서울숲길 28, 1층 Bloom Oven 입니다. 서울숲역에서 도보 6분 거리이고, 매장 앞 10분 정차 픽업이 가능해요."},
      {k:["배송","택배","퀵","지역","보내","delivery"],a:"퀵 배송은 성동구, 광진구, 강남 일부 지역을 우선 운영해요. 거리와 시간대에 따라 배송비가 달라지며, 그 외 지역은 상담을 통해 안내드립니다."},
      {k:["예약","주문","며칠","언제까지","리드","제작","order"],a:"예약은 제작 순서대로 진행돼요.\n• 홀케이크: 2일 전\n• 단체 구움과자 세트: 3일 전 권장\n성수기에는 더 빨리 마감되니 여유 있게 신청해 주세요. 홈페이지 예약 폼에서 바로 신청하실 수 있어요."},
      {k:["메뉴","추천","케이크","크루아상","가격","얼마","price","세트"],a:"대표 메뉴예요.\n• 스트로베리 클라우드 ₩42,000\n• 버터 크루아상 박스(6입) ₩24,000\n• 블룸 티타임 세트 ₩31,000\n답례품·기념일 케이크·커스텀 케이크도 상담 가능합니다."},
      {k:["알레르기","성분","견과","알러지","allergy"],a:"모든 제품의 주요 원재료와 알레르기 유발 성분을 주문 상담 시 안내드려요. 다만 견과류 공정은 분리되어 있지 않은 점 참고 부탁드립니다."},
      {k:["대량","기업","단체","답례","행사","견적","bulk"],a:"기업·단체 대량 주문 가능합니다. 행사 일정, 예산, 브랜딩 스티커 여부를 알려주시면 맞춤 견적서를 보내드려요. 이메일 hello@bloomoven.kr 로 문의 주세요."},
      {k:["연락","문의","전화","이메일","카톡","contact"],a:"문의는 이메일 hello@bloomoven.kr / 전화 02-1234-5678 로 가능합니다. 홈페이지 예약 폼을 남겨주시면 확인 후 순차적으로 연락드려요."},
      {k:["픽업","가져","방문"],a:"매장 픽업은 영업시간 내 가능하며, 예약 픽업은 마감 후 1시간까지 받아드려요. 매장 앞 10분 정차 픽업도 가능합니다."},
      {k:["고마","감사","thank","고맙"],a:"감사합니다 ✿ 더 궁금한 점이 있으면 언제든 물어봐 주세요!"}
    ];
    var QUICK=["영업시간 알려줘","배송 지역이 어디예요?","예약은 며칠 전에?","대표 메뉴 추천","대량 주문 문의"];

    function faqAnswer(text){
      var t=text.toLowerCase();
      var best=null,score=0;
      FAQ.forEach(function(f){
        var s=0; f.k.forEach(function(w){ if(t.indexOf(w.toLowerCase())>-1) s++; });
        if(s>score){score=s;best=f;}
      });
      if(best) return best.a;
      return "죄송해요, 정확히 이해하지 못했어요. 영업시간 · 위치 · 배송 · 예약 · 메뉴 · 대량주문 중 궁금한 키워드로 다시 물어봐 주세요. 급하시면 hello@bloomoven.kr 로 연락 주셔도 좋아요!";
    }

    function bubble(text,who){
      var d=document.createElement("div");
      d.className="msg "+who; d.textContent=text;
      log.appendChild(d); log.scrollTop=log.scrollHeight;
      return d;
    }

    /* ---- Optional OpenAI ---- */
    function getKey(){ try{return localStorage.getItem(KEY_STORE)||"";}catch(e){return "";} }
    var SYSTEM="당신은 베이커리 'Bloom Oven'의 친절한 한국어 상담원입니다. 아래 정보로만 답하고, 모르면 이메일(hello@bloomoven.kr) 문의를 권하세요. 답변은 간결하고 따뜻하게.\n정보: 위치=서울 성동구 서울숲길 28 1층(서울숲역 도보6분). 영업=월-금10-19, 토11-18, 일 예약픽업전용, 화 휴무. 배송=성동/광진/강남 일부 퀵배송. 예약=홀케이크 2일전, 세트 3일전 권장. 메뉴=스트로베리 클라우드 42000, 버터 크루아상 박스 24000, 블룸 티타임 세트 31000. 견과류 공정 미분리. 대량주문 가능(견적 이메일).";

    function openaiAnswer(text){
      var key=getKey();
      return fetch("https://api.openai.com/v1/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
        body:JSON.stringify({model:"gpt-4o-mini",temperature:0.5,messages:[
          {role:"system",content:SYSTEM},
          {role:"user",content:text}
        ]})
      }).then(function(r){
        if(!r.ok) throw new Error("api");
        return r.json();
      }).then(function(j){
        return (j.choices&&j.choices[0]&&j.choices[0].message.content||"").trim()||faqAnswer(text);
      });
    }

    function respond(text){
      var typing=bubble("입력 중…","bot typing");
      var done=function(ans){ typing.remove(); bubble(ans,"bot"); };
      if(getKey()){
        openaiAnswer(text).then(done).catch(function(){ typing.remove(); bubble(faqAnswer(text)+"\n\n(자동 상담으로 응답했어요.)","bot"); });
      }else{
        setTimeout(function(){ done(faqAnswer(text)); }, 420);
      }
    }

    function submit(text){
      text=(text||input.value).trim();
      if(!text) return;
      bubble(text,"user"); input.value=""; respond(text);
    }
    send.addEventListener("click",function(){submit();});
    input.addEventListener("keydown",function(e){ if(e.key==="Enter") submit(); });

    QUICK.forEach(function(q){
      var c=document.createElement("button");
      c.className="chip"; c.type="button"; c.textContent=q;
      c.addEventListener("click",function(){ submit(q); });
      quick.appendChild(c);
    });

    /* ---- key controls ---- */
    var keyInput=document.getElementById("keyInput"),
        keyStatus=document.getElementById("keyStatus");
    function refreshKey(){ keyStatus.textContent=getKey()?"✓ API 키가 설정되어 있습니다 (자연어 상담 모드).":"현재 FAQ 기반 상담 모드입니다."; }
    document.getElementById("keySave").addEventListener("click",function(){
      try{ localStorage.setItem(KEY_STORE,keyInput.value.trim()); }catch(e){}
      keyInput.value=""; refreshKey();
    });
    document.getElementById("keyClear").addEventListener("click",function(){
      try{ localStorage.removeItem(KEY_STORE); }catch(e){}
      refreshKey();
    });
    refreshKey();

    bubble("안녕하세요! Bloom Oven 24시간 상담봇이에요 ✿\n메뉴·예약·배송·영업시간 등 무엇이든 편하게 물어봐 주세요.","bot");
  })();
  </script>
</body>
</html>
