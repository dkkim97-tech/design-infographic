<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom Oven | 관리자 대시보드</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127874;</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-wrap{max-width:1120px;margin:0 auto;padding:24px 24px 60px}
    .admin-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:26px}
    .admin-top h1{font-size:32px;color:var(--sage-ink)}
    .admin-top .sub{font-size:13px;color:var(--ink-soft)}
    .admin-actions{display:flex;gap:10px;flex-wrap:wrap}
    .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
    .stat{padding:22px 24px;border-radius:var(--radius)}
    .stat .num{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:700;line-height:1;color:var(--sage-deep)}
    .stat .lbl{font-size:13px;color:var(--ink-soft);margin-top:8px}
    .stat.pink .num{color:var(--blush-deep)}
    .filter-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
    .filter-row .chip{padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600;color:var(--sage-ink);cursor:pointer;
      border:1px solid rgba(255,255,255,.75);background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(247,241,232,.5));
      box-shadow:inset 0 1px 1px rgba(255,255,255,.9);transition:transform .16s,box-shadow .18s,background .2s}
    .filter-row .chip.active{color:#fff;background:linear-gradient(180deg,var(--sage),var(--sage-deep));box-shadow:0 6px 16px rgba(79,122,99,.32)}
    .filter-row .chip:hover{transform:translateY(-1px)}
    .table-panel{padding:8px;overflow:hidden}
    .table-scroll{overflow-x:auto}
    table{width:100%;border-collapse:collapse;min-width:820px}
    th,td{text-align:left;padding:14px 14px;font-size:13.5px;border-bottom:1px solid var(--line);vertical-align:top}
    th{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-faint);font-weight:700;white-space:nowrap}
    td strong{color:var(--ink)}
    td .meta{color:var(--ink-faint);font-size:12px}
    tr:last-child td{border-bottom:none}
    .badge{display:inline-block;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
    .badge.new{background:rgba(230,176,170,.28);color:#b85f57}
    .badge.confirmed{background:rgba(147,182,162,.28);color:var(--sage-ink)}
    .badge.done{background:rgba(120,120,120,.16);color:#6b6b6b}
    .badge.ship{background:rgba(226,169,63,.2);color:#a9791f}
    .badge.pick{background:rgba(147,182,162,.2);color:var(--sage-ink)}
    .row-actions{display:flex;gap:6px;flex-wrap:wrap}
    .mini{padding:6px 10px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid rgba(79,122,99,.2);
      background:rgba(255,255,255,.75);color:var(--sage-ink);transition:background .16s,transform .14s;white-space:nowrap}
    .mini:hover{background:#fff;transform:translateY(-1px)}
    .mini.danger{color:#b85f57;border-color:rgba(214,141,134,.4)}
    .empty{padding:60px 20px;text-align:center;color:var(--ink-faint)}
    .empty .big{font-size:40px;opacity:.4;margin-bottom:10px}
    /* login gate */
    .gate{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:24px;
      background:
        radial-gradient(900px 500px at 80% 0%, rgba(147,182,162,.4), transparent 55%),
        radial-gradient(800px 500px at 10% 100%, rgba(241,210,205,.5), transparent 55%),
        var(--cream)}
    .gate-box{width:100%;max-width:360px;padding:34px 32px;text-align:center}
    .gate-box h2{font-size:28px;color:var(--sage-ink);margin-bottom:6px}
    .gate-box p{font-size:13px;color:var(--ink-soft);margin-bottom:18px}
    .gate-box input{width:100%;font-family:inherit;font-size:15px;padding:13px 16px;border-radius:14px;text-align:center;
      border:1px solid rgba(79,122,99,.25);background:rgba(255,255,255,.85);outline:none;margin-bottom:12px}
    .gate-box input:focus{border-color:var(--sage-mid);box-shadow:0 0 0 4px rgba(147,182,162,.2)}
    .gate-err{font-size:12px;color:var(--blush-deep);min-height:16px;margin-bottom:6px}
    .hint{font-size:11px;color:var(--ink-faint);margin-top:14px}
    @media(max-width:760px){.stat-row{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <!-- Login gate -->
  <div class="gate" id="gate">
    <div class="gate-box glass-panel">
      <h2>관리자 로그인</h2>
      <p>Bloom Oven 예약 대시보드</p>
      <input id="pw" type="password" placeholder="비밀번호" autocomplete="off">
      <div class="gate-err" id="gateErr"></div>
      <button class="btn btn-primary block" id="gateBtn">로그인</button>
      <p class="hint">데모 비밀번호: <strong>bloom1234</strong></p>
    </div>
  </div>

  <div class="admin-wrap" id="app" hidden>
    <div class="admin-top">
      <div>
        <h1>예약 대시보드</h1>
        <p class="sub">홈페이지 예약 폼으로 접수된 주문을 이 브라우저에서 관리합니다.</p>
      </div>
      <div class="admin-actions">
        <button class="btn btn-secondary btn-sm" id="exportBtn">CSV 내보내기</button>
        <button class="btn btn-ghost btn-sm" id="seedBtn">샘플 데이터</button>
        <a class="btn btn-secondary btn-sm" href="index.html">← 홈으로</a>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat glass-panel"><div class="num" id="stTotal">0</div><div class="lbl">전체 예약</div></div>
      <div class="stat glass-panel pink"><div class="num" id="stNew">0</div><div class="lbl">신규 접수</div></div>
      <div class="stat glass-panel"><div class="num" id="stPickup">0</div><div class="lbl">매장 픽업</div></div>
      <div class="stat glass-panel"><div class="num" id="stShip">0</div><div class="lbl">배송 요청</div></div>
    </div>

    <div class="filter-row" id="filters">
      <span class="chip active" data-f="all">전체</span>
      <span class="chip" data-f="new">신규</span>
      <span class="chip" data-f="confirmed">확정</span>
      <span class="chip" data-f="done">완료</span>
    </div>

    <div class="table-panel glass-panel">
      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>접수</th><th>고객</th><th>메뉴 / 수량</th><th>수령</th><th>요청사항</th><th>상태</th><th>관리</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" hidden><div class="big">✿</div>아직 접수된 예약이 없습니다.<br>홈페이지 예약 폼에서 신청하거나 "샘플 데이터"를 눌러보세요.</div>
    </div>
  </div>

  <script>
  (function(){
    "use strict";
    var STORE="bloom_reservations", PW="bloom1234", AUTH="bloom_admin_auth";
    var gate=document.getElementById("gate"),app=document.getElementById("app");

    function unlock(){ gate.style.display="none"; app.hidden=false; render(); }
    if(sessionStorage.getItem(AUTH)==="1") unlock();
    var pw=document.getElementById("pw"),gateErr=document.getElementById("gateErr");
    function tryLogin(){
      if(pw.value===PW){ try{sessionStorage.setItem(AUTH,"1");}catch(e){} unlock(); }
      else{ gateErr.textContent="비밀번호가 올바르지 않습니다."; pw.select(); }
    }
    document.getElementById("gateBtn").addEventListener("click",tryLogin);
    pw.addEventListener("keydown",function(e){ if(e.key==="Enter") tryLogin(); });

    function load(){ try{return JSON.parse(localStorage.getItem(STORE)||"[]");}catch(e){return [];} }
    function save(list){ try{localStorage.setItem(STORE,JSON.stringify(list));}catch(e){} }
    function esc(s){ return String(s||"").replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
    function fmtDate(iso){ try{var d=new Date(iso);return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}catch(e){return "";} }

    var STATUS={new:{label:"신규",cls:"new",next:"confirmed"},confirmed:{label:"확정",cls:"confirmed",next:"done"},done:{label:"완료",cls:"done",next:"new"}};
    var filter="all";

    function render(){
      var list=load();
      document.getElementById("stTotal").textContent=list.length;
      document.getElementById("stNew").textContent=list.filter(function(r){return r.status==="new";}).length;
      document.getElementById("stPickup").textContent=list.filter(function(r){return r.delivery_type!=="배송 요청";}).length;
      document.getElementById("stShip").textContent=list.filter(function(r){return r.delivery_type==="배송 요청";}).length;

      var shown=list.filter(function(r){return filter==="all"||r.status===filter;});
      var rows=document.getElementById("rows"),empty=document.getElementById("empty");
      rows.innerHTML="";
      empty.hidden=shown.length>0;

      shown.forEach(function(r){
        var st=STATUS[r.status]||STATUS.new;
        var ship=r.delivery_type==="배송 요청";
        var tr=document.createElement("tr");
        tr.innerHTML=
          "<td><span class='meta'>"+esc(fmtDate(r.created))+"</span></td>"+
          "<td><strong>"+esc(r.name)+"</strong><br><span class='meta'>"+esc(r.phone)+(r.email?" · "+esc(r.email):"")+"</span></td>"+
          "<td><strong>"+esc(r.menu)+"</strong><br><span class='meta'>수량 "+esc(r.quantity)+"</span></td>"+
          "<td><span class='badge "+(ship?"ship":"pick")+"'>"+esc(r.delivery_type)+"</span><br><span class='meta'>"+esc(r.pickup_date)+(ship&&r.address?"<br>"+esc(r.address):"")+"</span></td>"+
          "<td><span class='meta'>"+(esc(r.request)||"—")+"</span></td>"+
          "<td><span class='badge "+st.cls+"'>"+st.label+"</span></td>"+
          "<td><div class='row-actions'>"+
            "<button class='mini' data-act='advance' data-id='"+r.id+"'>"+ (r.status==="done"?"신규로":(r.status==="new"?"확정":"완료")) +"</button>"+
            "<button class='mini danger' data-act='del' data-id='"+r.id+"'>삭제</button>"+
          "</div></td>";
        rows.appendChild(tr);
      });
    }

    document.getElementById("rows").addEventListener("click",function(e){
      var b=e.target.closest("button"); if(!b) return;
      var id=Number(b.getAttribute("data-id")),act=b.getAttribute("data-act");
      var list=load(),i=list.findIndex(function(r){return r.id===id;});
      if(i<0) return;
      if(act==="del"){ if(!confirm("이 예약을 삭제할까요?")) return; list.splice(i,1); }
      else if(act==="advance"){ list[i].status=(STATUS[list[i].status]||STATUS.new).next; }
      save(list); render();
    });

    document.getElementById("filters").addEventListener("click",function(e){
      var c=e.target.closest(".chip"); if(!c) return;
      filter=c.getAttribute("data-f");
      [].forEach.call(this.querySelectorAll(".chip"),function(x){x.classList.toggle("active",x===c);});
      render();
    });

    document.getElementById("exportBtn").addEventListener("click",function(){
      var list=load();
      if(!list.length){ alert("내보낼 예약이 없습니다."); return; }
      var head=["접수시각","이름","연락처","이메일","메뉴","수량","수령방식","수령일","주소","요청사항","상태"];
      var rows=list.map(function(r){return [r.created,r.name,r.phone,r.email,r.menu,r.quantity,r.delivery_type,r.pickup_date,r.address,(r.request||"").replace(/\n/g," "),r.status];});
      var csv=[head].concat(rows).map(function(row){return row.map(function(c){return '"'+String(c==null?"":c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
      var blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
      var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="bloom-reservations.csv";a.click();URL.revokeObjectURL(a.href);
    });

    document.getElementById("seedBtn").addEventListener("click",function(){
      var now=Date.now();
      var samples=[
        {id:now,created:new Date().toISOString(),status:"new",name:"김서윤",phone:"010-2211-3344",email:"seoyoon@example.com",pickup_date:"2026-08-02",menu:"스트로베리 클라우드",quantity:"1",delivery_type:"배송 요청",address:"서울 성동구 왕십리로 100",request:"리본 포장, 초 5개 부탁드려요"},
        {id:now-1,created:new Date(now-3600e3).toISOString(),status:"confirmed",name:"박도현",phone:"010-8899-1020",email:"",pickup_date:"2026-08-01",menu:"버터 크루아상 박스",quantity:"3",delivery_type:"매장 픽업",address:"",request:""},
        {id:now-2,created:new Date(now-7200e3).toISOString(),status:"done",name:"플라워 스튜디오",phone:"010-5566-7788",email:"studio@example.com",pickup_date:"2026-07-28",menu:"블룸 티타임 세트",quantity:"10",delivery_type:"배송 요청",address:"서울 강남구 도산대로 27",request:"답례품, 브랜딩 스티커 부착"}
      ];
      var list=load();
      samples.forEach(function(s){ if(!list.some(function(r){return r.id===s.id;})) list.unshift(s); });
      save(list); render();
    });
  })();
  </script>
</body>
</html>
