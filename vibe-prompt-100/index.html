<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Vibe Prompt 100 — 바이브 코딩 프롬프트 라이브러리</title>
<meta name="description" content="바이브 코딩을 위한 100개의 실전 프롬프트 라이브러리. 아이디어부터 배포까지 복사해서 바로 쓰는 프롬프트 모음."/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
/* Design tokens — overridden per selected theme (default = Vivid) */
:root{
  --bg:#f4f4f5; --surface:#ffffff; --surface-2:#fafafa; --border:#e8e8e8; --border-2:#f4f4f5;
  --text:#18181b; --sub:#a1a1aa; --sub-2:#71717a;
  --accent:#18181b; --accent-text:#ffffff; --accent-soft:#e4e4e7;
  --radius:10px; --font:'Noto Sans KR','IBM Plex Sans',sans-serif;
}
body{background:var(--bg);font-family:var(--font);color:var(--text);min-height:100vh;transition:background .3s ease,color .3s ease}
input,button,textarea,select{font-family:inherit}
::selection{background:#e0e7ff;color:#3730a3}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#9ca3af}

/* Design-select intro screen */
.ds-screen{min-height:100vh;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;animation:fadeIn .4s ease both}
.ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;width:100%;max-width:860px}
.ds-card{border:2px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;text-align:left}
.ds-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.14)}
.ds-swatch{height:96px;display:flex;align-items:center;justify-content:center;position:relative}
.ds-dots{position:absolute;bottom:10px;left:12px;display:flex;gap:6px}
.ds-dot{width:14px;height:14px;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2)}
@media(max-width:600px){.ds-grid{grid-template-columns:1fr 1fr;gap:12px}}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.card-enter{animation:fadeIn .35s ease both}

/* Card hover */
.style-card{transition:box-shadow .22s ease,transform .22s ease}
.style-card:hover{box-shadow:0 8px 32px rgba(0,0,0,.1)!important;transform:translateY(-3px)}
.style-card:hover .card-actions{opacity:1!important}
.style-card:hover .fav-btn{opacity:1!important}

/* Category pills */
.cat-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 6px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:-.2px;white-space:nowrap}
.cat-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* Action buttons */
.act-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--sub-2);font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.act-btn:hover{background:var(--surface-2);border-color:#d1d5db;color:var(--text)}
.act-btn.copied{background:#f0fdf4;border-color:#86efac;color:#16a34a}
.act-btn svg{width:13px;height:13px;flex-shrink:0}

/* Tab buttons */
.tab-btn{padding:6px 14px;border-radius:20px;border:1px solid transparent;background:transparent;color:var(--sub-2);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.tab-btn:hover{background:var(--accent-soft);color:var(--text)}
.tab-btn.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}

/* Admin buttons */
.admin-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--sub-2);font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px}
.admin-btn:hover{background:var(--surface-2);border-color:#d1d5db}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-text);padding:10px 24px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.2);white-space:nowrap;transition:all .3s ease}

/* Modal overlay */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-box{background:var(--surface);border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.28);animation:slideUp .25s ease;max-height:90vh;overflow:hidden;display:flex;flex-direction:column}

/* Search input */
.search-wrap{position:relative;flex:1;max-width:320px}
.search-wrap input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;background:var(--surface);color:var(--text);transition:border-color .15s}
.search-wrap input:focus{border-color:#a5b4fc}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#a1a1aa}

/* Hero banner */
.hero-band{position:relative;overflow:hidden}
.hero-band::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 78% 20%,rgba(255,255,255,.25),transparent 45%)}

/* Responsive */
@media(max-width:900px){
  .grid-4{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))!important}
}
@media(max-width:600px){
  .grid-4{grid-template-columns:1fr 1fr!important;gap:12px!important}
  .header-inner{flex-direction:column;gap:10px!important}
  .tab-row{flex-wrap:wrap}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;

/* ══════════════════════════════════════
   CONFIG
══════════════════════════════════════ */
const ADMIN_PW="vibe100";
const SITE_URL="https://vibe-prompt-100.vercel.app/";
const EDITS_KEY="vibe-prompt-100-edits";
const FAVS_KEY="vibe-prompt-100-favs";
const THEME_KEY="vibe-prompt-100-theme";

/* ══════════════════════════════════════
   DESIGN THEMES — 실행 시 선택하는 앱 디자인
══════════════════════════════════════ */
const THEMES=[
  {id:"vivid",name:"비비드",en:"Vivid",emoji:"⚡",desc:"밝은 그레이 캔버스 · 컬러 강조",dots:["#6366f1","#ec4899","#f59e0b"],
    tok:{"--bg":"#f4f4f5","--surface":"#ffffff","--surface-2":"#fafafa","--border":"#e8e8e8","--border-2":"#f4f4f5","--text":"#18181b","--sub":"#a1a1aa","--sub-2":"#71717a","--accent":"#18181b","--accent-text":"#ffffff","--accent-soft":"#e4e4e7","--radius":"10px","--font":"'Noto Sans KR','IBM Plex Sans',sans-serif"}},
  {id:"cream",name:"크림 코랄",en:"Cream Coral",emoji:"🍑",desc:"크림 배경 · 코랄 포인트 · 세리프",dots:["#d97757","#c2410c","#f5e6d3"],
    tok:{"--bg":"#f7f3ec","--surface":"#fffdf8","--surface-2":"#f4ede1","--border":"#e7ddca","--border-2":"#efe7d8","--text":"#2b2018","--sub":"#a8977f","--sub-2":"#8a7a63","--accent":"#d97757","--accent-text":"#ffffff","--accent-soft":"#efe1d6","--radius":"12px","--font":"'Noto Sans KR','IBM Plex Sans',sans-serif"}},
  {id:"mono",name:"모노 미니멀",en:"Mono Minimal",emoji:"◼️",desc:"순백 · 블랙 · 여백 강조",dots:["#111111","#666666","#e5e5e5"],
    tok:{"--bg":"#ffffff","--surface":"#ffffff","--surface-2":"#f7f7f7","--border":"#e5e5e5","--border-2":"#f0f0f0","--text":"#111111","--sub":"#9a9a9a","--sub-2":"#6b6b6b","--accent":"#111111","--accent-text":"#ffffff","--accent-soft":"#efefef","--radius":"6px","--font":"'IBM Plex Sans','Noto Sans KR',sans-serif"}},
  {id:"dark",name:"다크 테크",en:"Dark Tech",emoji:"🌙",desc:"딥 네이비 · 인디고 글로우",dots:["#6366f1","#0ea5e9","#1a1a22"],
    tok:{"--bg":"#0f0f16","--surface":"#1a1a24","--surface-2":"#232330","--border":"#2c2c3a","--border-2":"#26262f","--text":"#e9e9f2","--sub":"#7c7c92","--sub-2":"#9a9ab0","--accent":"#6366f1","--accent-text":"#ffffff","--accent-soft":"#2a2a3a","--radius":"10px","--font":"'IBM Plex Sans','Noto Sans KR',sans-serif"}},
  {id:"pastel",name:"파스텔",en:"Pastel",emoji:"🎨",desc:"라벤더 · 소프트 바이올렛",dots:["#8b5cf6","#ec4899","#a78bfa"],
    tok:{"--bg":"#f5f3ff","--surface":"#ffffff","--surface-2":"#f6f2fe","--border":"#e7e0fb","--border-2":"#efeafe","--text":"#3b2f57","--sub":"#a99cc9","--sub-2":"#8478a8","--accent":"#8b5cf6","--accent-text":"#ffffff","--accent-soft":"#ece5fb","--radius":"14px","--font":"'Noto Sans KR','IBM Plex Sans',sans-serif"}},
  {id:"ocean",name:"오션",en:"Ocean",emoji:"🌊",desc:"클린 블루 · 상쾌한 톤",dots:["#0ea5e9","#14b8a6","#38bdf8"],
    tok:{"--bg":"#eef6fb","--surface":"#ffffff","--surface-2":"#eaf4fa","--border":"#d5e7f1","--border-2":"#e4f0f7","--text":"#0c3a52","--sub":"#7fa8bd","--sub-2":"#4f7f97","--accent":"#0284c7","--accent-text":"#ffffff","--accent-soft":"#dcedf7","--radius":"12px","--font":"'Noto Sans KR','IBM Plex Sans',sans-serif"}},
];
const applyTheme=id=>{
  const t=THEMES.find(x=>x.id===id)||THEMES[0];
  const r=document.documentElement;
  Object.entries(t.tok).forEach(([k,v])=>r.style.setProperty(k,v));
};

const CATS=["ALL","FAVORITES","IDEA","PLAN","UIUX","FRONT","BACK","DATA","DEBUG","DEPLOY","AI","GROWTH"];
const CAT_IN=["IDEA","PLAN","UIUX","FRONT","BACK","DATA","DEBUG","DEPLOY","AI","GROWTH"];
const CC={IDEA:"#f59e0b",PLAN:"#6366f1",UIUX:"#ec4899",FRONT:"#3b82f6",BACK:"#14b8a6",DATA:"#8b5cf6",DEBUG:"#ef4444",DEPLOY:"#22c55e",AI:"#0ea5e9",GROWTH:"#f97316"};
const CAT_KO={IDEA:"아이디어",PLAN:"기획·설계",UIUX:"UI/UX",FRONT:"프론트엔드",BACK:"백엔드",DATA:"데이터",DEBUG:"디버깅",DEPLOY:"배포",AI:"AI 연동",GROWTH:"그로스"};
const CAT_EMOJI={IDEA:"💡",PLAN:"📋",UIUX:"🎨",FRONT:"🖥️",BACK:"⚙️",DATA:"🗄️",DEBUG:"🐞",DEPLOY:"🚀",AI:"🤖",GROWTH:"📈"};
const CG={IDEA:"linear-gradient(135deg,#f59e0b,#f97316)",PLAN:"linear-gradient(135deg,#6366f1,#818cf8)",UIUX:"linear-gradient(135deg,#ec4899,#f472b6)",FRONT:"linear-gradient(135deg,#3b82f6,#60a5fa)",BACK:"linear-gradient(135deg,#14b8a6,#2dd4bf)",DATA:"linear-gradient(135deg,#8b5cf6,#a78bfa)",DEBUG:"linear-gradient(135deg,#ef4444,#f87171)",DEPLOY:"linear-gradient(135deg,#22c55e,#4ade80)",AI:"linear-gradient(135deg,#0ea5e9,#38bdf8)",GROWTH:"linear-gradient(135deg,#f97316,#fb923c)"};
const LV={1:"초급",2:"중급",3:"고급"};

/* ══════════════════════════════════════
   Storage helpers
══════════════════════════════════════ */
function lsLoad(k){try{const d=localStorage.getItem(k);return d?JSON.parse(d):null;}catch(e){return null;}}
function lsSave(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){console.warn('lsSave fail',e);}}

/* ══════════════════════════════════════
   DEFAULT PROMPTS — 100 vibe-coding prompts
══════════════════════════════════════ */
const DEFAULTS=[
  /* ── IDEA 💡 ── */
  {id:1,cat:"IDEA",lv:1,ko:"아이디어 브레인스토밍",en:"Idea Brainstorm",prompt:"너는 시니어 프로덕트 매니저야. 관심 분야 [분야]에서 실제 사용자의 페인포인트 3가지를 도출하고, 각각을 해결하는 앱 아이디어 3개를 제안해줘. 각 아이디어는 한 줄 컨셉, 타깃 유저, 핵심 기능 3가지, 수익 모델을 포함해줘."},
  {id:2,cat:"IDEA",lv:1,ko:"페인포인트 발굴",en:"Pain Point Mining",prompt:"[타깃 사용자]가 [상황]에서 겪는 불편함을 하루 동선(Job-to-be-done) 관점으로 10개 나열해줘. 각 항목마다 빈도, 심각도(상/중/하), 현재 대안, 개선 여지를 표로 정리해줘."},
  {id:3,cat:"IDEA",lv:2,ko:"린 캔버스 검증",en:"Lean Canvas",prompt:"다음 아이디어를 린 캔버스로 정리해줘: [아이디어]. 문제·고객군·고유가치제안·솔루션·채널·수익원·비용구조·핵심지표·경쟁우위 9칸을 표로 채우고, 가장 큰 리스크 2가지와 이를 검증할 실험을 제안해줘."},
  {id:4,cat:"IDEA",lv:2,ko:"경쟁 분석",en:"Competitor Analysis",prompt:"[제품 카테고리]의 주요 경쟁 서비스 5개를 비교해줘. 각 서비스의 핵심 기능, 가격, 타깃, 강점, 약점을 표로 정리하고, 시장에 아직 비어있는 포지셔닝 기회 2가지를 알려줘."},
  {id:5,cat:"IDEA",lv:1,ko:"타깃 페르소나 정의",en:"Persona Definition",prompt:"[서비스 설명]의 핵심 사용자 페르소나 2명을 만들어줘. 각 페르소나는 이름·나이·직업·목표·불편함·자주 쓰는 도구·구매 결정 요인을 포함하고, 이 사람을 만족시킬 첫 기능을 제안해줘."},
  {id:6,cat:"IDEA",lv:2,ko:"MVP 범위 정하기",en:"MVP Scoping",prompt:"[아이디어]로 4주 안에 출시 가능한 MVP를 설계해줘. 반드시 넣을 기능(Must), 나중에 넣을 기능(Later), 절대 안 넣을 기능(Never)으로 분류하고, MVP로 검증할 단 하나의 가설을 명확히 정의해줘."},
  {id:7,cat:"IDEA",lv:1,ko:"네이밍 & 슬로건",en:"Naming & Slogan",prompt:"[서비스 컨셉]에 어울리는 서비스 이름 후보 10개를 제안해줘. 각 이름은 발음·의미·도메인 가용성 느낌·한 줄 슬로건을 함께 제시하고, 가장 추천하는 3개와 이유를 알려줘."},
  {id:8,cat:"IDEA",lv:2,ko:"수익 모델 설계",en:"Revenue Model",prompt:"[서비스]에 적용 가능한 수익 모델 4가지(구독·프리미엄·광고·수수료 등)를 비교해줘. 각 모델의 예상 전환 지점, 장단점, 초기 스타트업에 적합한 정도를 평가하고 추천안을 제시해줘."},
  {id:9,cat:"IDEA",lv:2,ko:"차별화 포인트",en:"Differentiation",prompt:"[내 서비스]가 기존 [경쟁 서비스] 대비 확실히 이길 수 있는 차별화 포인트 3가지를 정의해줘. 각 포인트를 '왜 사용자가 갈아탈까'의 관점에서 한 문장으로 설명하고, 이를 증명할 지표를 제안해줘."},
  {id:10,cat:"IDEA",lv:3,ko:"아이디어 리스크 진단",en:"Idea Risk Audit",prompt:"[아이디어]가 실패할 수 있는 이유를 시장·기술·팀·타이밍 4개 축으로 진단해줘. 각 리스크의 발생 확률과 영향도를 점수화하고, 가장 치명적인 리스크를 먼저 없앨 검증 순서를 제안해줘."},

  /* ── PLAN 📋 ── */
  {id:11,cat:"PLAN",lv:2,ko:"PRD 작성",en:"Write a PRD",prompt:"[기능/제품]에 대한 제품 요구사항 문서(PRD)를 작성해줘. 배경, 목표, 성공 지표, 사용자 스토리, 기능 요구사항, 비기능 요구사항, 범위 밖(Out of scope), 오픈 이슈 섹션을 포함해줘."},
  {id:12,cat:"PLAN",lv:1,ko:"사용자 스토리 도출",en:"User Stories",prompt:"[기능]에 대한 사용자 스토리를 'As a [역할], I want [행동], so that [가치]' 형식으로 8개 작성해줘. 각 스토리마다 수용 기준(Acceptance Criteria)을 Given-When-Then으로 붙여줘."},
  {id:13,cat:"PLAN",lv:1,ko:"기능 우선순위(MoSCoW)",en:"Prioritization",prompt:"다음 기능 목록을 MoSCoW(Must/Should/Could/Won't)로 분류해줘: [기능 목록]. 각 기능의 사용자 가치와 개발 난이도를 함께 표시하고, 첫 스프린트에서 개발할 순서를 제안해줘."},
  {id:14,cat:"PLAN",lv:2,ko:"정보구조(IA) 설계",en:"Information Architecture",prompt:"[서비스]의 전체 정보구조(IA)를 트리 형태로 설계해줘. 최상위 내비게이션, 각 화면과 하위 화면, 화면 간 관계를 정리하고, 사용자가 핵심 작업을 3클릭 이내에 끝낼 수 있는지 검토해줘."},
  {id:15,cat:"PLAN",lv:2,ko:"화면 흐름(User Flow)",en:"User Flow",prompt:"[핵심 시나리오, 예: 회원가입 후 첫 결제]의 사용자 플로우를 단계별로 설계해줘. 각 단계의 화면, 사용자 액션, 시스템 반응, 이탈 가능 지점과 대응책을 표로 정리해줘."},
  {id:16,cat:"PLAN",lv:2,ko:"데이터 모델 설계",en:"Data Model",prompt:"[서비스]에 필요한 데이터 모델을 설계해줘. 주요 엔티티, 각 엔티티의 필드와 타입, 엔티티 간 관계(1:N, N:M)를 ER 다이어그램 텍스트로 표현하고, 정규화 관점의 개선점을 알려줘."},
  {id:17,cat:"PLAN",lv:2,ko:"API 명세 초안",en:"API Spec Draft",prompt:"[기능]에 필요한 REST API 엔드포인트를 설계해줘. 각 엔드포인트의 메서드, 경로, 요청 파라미터, 응답 예시(JSON), 상태 코드, 인증 필요 여부를 표로 정리해줘."},
  {id:18,cat:"PLAN",lv:1,ko:"기술 스택 추천",en:"Tech Stack",prompt:"[프로젝트 설명]과 [팀 규모/경험]을 고려해 최적의 기술 스택을 추천해줘. 프론트엔드·백엔드·DB·배포·인증 각각에 대해 1순위와 대안을 제시하고, 왜 이 조합이 빠른 출시에 유리한지 설명해줘."},
  {id:19,cat:"PLAN",lv:2,ko:"개발 로드맵",en:"Roadmap",prompt:"[제품]의 3개월 개발 로드맵을 2주 단위 마일스톤으로 짜줘. 각 마일스톤의 목표, 산출물, 주요 리스크를 정리하고, 데모 가능한 시점을 표시해줘."},
  {id:20,cat:"PLAN",lv:1,ko:"릴리즈 체크리스트",en:"Release Checklist",prompt:"[웹앱] 첫 배포 전에 점검할 릴리즈 체크리스트를 만들어줘. 기능·보안·성능·SEO·모니터링·법적(개인정보/약관) 항목으로 나누고, 각 항목을 배포 차단(Blocker)인지 아닌지 표시해줘."},

  /* ── UIUX 🎨 ── */
  {id:21,cat:"UIUX",lv:1,ko:"랜딩페이지 구성",en:"Landing Page",prompt:"[서비스]의 랜딩페이지 구조와 카피를 작성해줘. 히어로(헤드라인·서브·CTA), 문제 제기, 솔루션, 핵심 기능 3개, 사회적 증거, 가격, FAQ, 마지막 CTA 순으로 각 섹션의 실제 문구를 제안해줘."},
  {id:22,cat:"UIUX",lv:2,ko:"디자인 시스템 토큰",en:"Design Tokens",prompt:"[브랜드 무드, 예: 신뢰감 있는 핀테크]에 맞는 디자인 토큰을 정의해줘. 컬러(primary/secondary/neutral/semantic), 타이포 스케일, 간격(spacing), 라운드, 그림자를 CSS 변수 형태로 제안해줘."},
  {id:23,cat:"UIUX",lv:1,ko:"컬러 팔레트 제안",en:"Color Palette",prompt:"[서비스 성격]에 어울리는 컬러 팔레트를 제안해줘. 메인·서브·강조·배경·텍스트 색을 HEX로 제시하고, 명도 대비(WCAG AA) 통과 여부와 다크모드 대응 색상까지 함께 알려줘."},
  {id:24,cat:"UIUX",lv:2,ko:"컴포넌트 설계",en:"Component Design",prompt:"[컴포넌트, 예: 카드]의 재사용 가능한 설계를 제안해줘. 필요한 props, 상태(기본/호버/선택/비활성), 반응형 동작, 접근성 속성을 정의하고 사용 예시를 보여줘."},
  {id:25,cat:"UIUX",lv:2,ko:"반응형 레이아웃",en:"Responsive Layout",prompt:"[화면]을 모바일·태블릿·데스크톱에 대응하는 반응형 레이아웃으로 설계해줘. 각 브레이크포인트의 컬럼 수, 요소 배치 변화, 숨김/노출 규칙을 CSS Grid/Flexbox 기준으로 제안해줘."},
  {id:26,cat:"UIUX",lv:1,ko:"마이크로카피 작성",en:"Microcopy",prompt:"[화면/기능]의 마이크로카피를 다듬어줘. 버튼 라벨, 플레이스홀더, 에러 메시지, 성공 메시지, 툴팁을 사용자 친화적인 톤으로 각각 2가지 버전(간결형/친근형)으로 제안해줘."},
  {id:27,cat:"UIUX",lv:2,ko:"온보딩 플로우",en:"Onboarding Flow",prompt:"신규 사용자가 [서비스]의 핵심 가치를 처음 60초 안에 경험하도록 온보딩 플로우를 설계해줘. 각 단계의 화면, 목표, 이탈 방지 장치, '아하 모먼트' 지점을 정의해줘."},
  {id:28,cat:"UIUX",lv:2,ko:"접근성 점검",en:"Accessibility Audit",prompt:"[화면/컴포넌트]의 웹 접근성(a11y)을 점검해줘. 키보드 내비게이션, 스크린리더용 aria 속성, 색 대비, 포커스 표시, 대체 텍스트 관점에서 문제점과 수정 방법을 목록으로 알려줘."},
  {id:29,cat:"UIUX",lv:2,ko:"다크모드 설계",en:"Dark Mode",prompt:"기존 라이트 테마 [설명]을 다크모드로 확장하는 규칙을 정의해줘. 배경·표면·텍스트·강조 색의 매핑 원칙, 그림자 대체(테두리/오버레이), prefers-color-scheme 대응 CSS 예시를 제안해줘."},
  {id:30,cat:"UIUX",lv:1,ko:"빈 상태 디자인",en:"Empty State",prompt:"[화면]의 빈 상태(Empty State)를 디자인해줘. 데이터가 없을 때의 일러스트 컨셉, 안내 문구, 다음 행동을 유도하는 CTA를 제안하고, 첫 사용/검색 결과 없음/에러 3가지 경우로 나눠 작성해줘."},

  /* ── FRONT 🖥️ ── */
  {id:31,cat:"FRONT",lv:1,ko:"React 컴포넌트 생성",en:"React Component",prompt:"[요구사항]을 만족하는 React 함수형 컴포넌트를 작성해줘. TypeScript와 함수형 훅을 사용하고, props 타입 정의, 접근성 속성, 간단한 사용 예시를 포함해줘. 불필요한 라이브러리 없이 구현해줘."},
  {id:32,cat:"FRONT",lv:1,ko:"Tailwind 스타일링",en:"Tailwind Styling",prompt:"[컴포넌트/화면]을 Tailwind CSS로 스타일링해줘. 반응형(sm/md/lg), 호버·포커스 상태, 다크모드(dark:)를 고려하고, 반복되는 클래스는 @apply나 컴포넌트로 정리하는 방법을 함께 제안해줘."},
  {id:33,cat:"FRONT",lv:2,ko:"상태관리 설계",en:"State Management",prompt:"[기능]의 상태관리를 설계해줘. 어떤 상태가 로컬/전역/서버 상태인지 분류하고, 각각에 적합한 도구(useState/Context/Zustand/React Query)를 추천하고 예시 코드를 보여줘."},
  {id:34,cat:"FRONT",lv:2,ko:"폼 검증",en:"Form Validation",prompt:"[폼 필드 목록]에 대한 폼을 react-hook-form과 zod로 구현해줘. 각 필드의 검증 규칙, 실시간 에러 메시지, 제출 처리, 로딩·성공·실패 상태를 포함한 코드를 작성해줘."},
  {id:35,cat:"FRONT",lv:2,ko:"애니메이션 추가",en:"Animation",prompt:"[요소/전환]에 자연스러운 애니메이션을 Framer Motion으로 추가해줘. 등장/퇴장, 리스트 stagger, 페이지 전환을 예시로 구현하고, 성능과 접근성(prefers-reduced-motion)을 고려한 팁을 알려줘."},
  {id:36,cat:"FRONT",lv:1,ko:"라우팅 구조",en:"Routing",prompt:"[서비스]의 라우팅 구조를 [React Router/Next.js App Router] 기준으로 설계해줘. 페이지 경로, 중첩 레이아웃, 보호된 라우트(인증 필요), 404 처리, 동적 경로를 코드 예시로 보여줘."},
  {id:37,cat:"FRONT",lv:2,ko:"데이터 페칭",en:"Data Fetching",prompt:"[API]를 React Query(TanStack Query)로 연동해줘. 쿼리 키 설계, 로딩·에러 처리, 캐싱과 재검증, 낙관적 업데이트(optimistic update)를 포함한 커스텀 훅으로 구현해줘."},
  {id:38,cat:"FRONT",lv:3,ko:"성능 최적화",en:"Performance",prompt:"[React 앱/화면]의 렌더링 성능을 진단하고 최적화해줘. 불필요한 리렌더, 무거운 계산, 큰 번들, 이미지 로딩 관점에서 문제를 찾고 memo/useMemo/코드 스플리팅/lazy 적용 방법을 제안해줘."},
  {id:39,cat:"FRONT",lv:2,ko:"컴포넌트 테스트",en:"Component Test",prompt:"[컴포넌트]에 대한 테스트를 React Testing Library와 Vitest로 작성해줘. 렌더링, 사용자 상호작용, 상태 변화, 엣지 케이스를 커버하고, 무엇을 테스트하지 말아야 하는지도 알려줘."},
  {id:40,cat:"FRONT",lv:1,ko:"SEO 메타 태그",en:"SEO Meta",prompt:"[페이지]의 SEO를 위한 메타 태그를 작성해줘. title, description, canonical, Open Graph, Twitter Card, JSON-LD 구조화 데이터를 포함하고, Next.js Metadata API 버전도 함께 제시해줘."},

  /* ── BACK ⚙️ ── */
  {id:41,cat:"BACK",lv:1,ko:"REST API 엔드포인트",en:"REST Endpoint",prompt:"[리소스]에 대한 CRUD REST API를 [Node.js/Express 또는 FastAPI]로 구현해줘. 라우팅, 요청 검증, 서비스 계층 분리, 일관된 응답 포맷, 상태 코드를 포함한 코드를 작성해줘."},
  {id:42,cat:"BACK",lv:2,ko:"인증/인가",en:"Auth (JWT)",prompt:"JWT 기반 인증을 구현해줘. 회원가입·로그인·토큰 발급·리프레시 토큰·로그아웃 흐름을 코드로 보여주고, 비밀번호 해싱(bcrypt), 토큰 만료, 인가 미들웨어를 포함해줘."},
  {id:43,cat:"BACK",lv:2,ko:"미들웨어 작성",en:"Middleware",prompt:"[요구사항, 예: 요청 로깅/인증 확인/CORS]을 처리하는 미들웨어를 작성해줘. 실행 순서, 에러 전파, next() 호출 규칙을 설명하고 재사용 가능한 형태로 구현해줘."},
  {id:44,cat:"BACK",lv:2,ko:"에러 핸들링 표준화",en:"Error Handling",prompt:"[백엔드]의 에러 핸들링을 표준화해줘. 커스텀 에러 클래스, 전역 에러 핸들러, 일관된 에러 응답 스키마(코드·메시지·상세), 로깅 연동, 운영/개발 환경 구분을 코드로 제안해줘."},
  {id:45,cat:"BACK",lv:2,ko:"입력 검증 & 보안",en:"Validation & Security",prompt:"[엔드포인트]의 입력 검증과 보안을 강화해줘. 스키마 검증(zod/joi), SQL 인젝션·XSS 방어, 민감정보 마스킹, 요청 크기 제한 관점에서 점검하고 수정 코드를 제시해줘."},
  {id:46,cat:"BACK",lv:2,ko:"파일 업로드 처리",en:"File Upload",prompt:"이미지/파일 업로드 기능을 구현해줘. 멀티파트 처리, 파일 타입·크기 검증, 스토리지(S3/로컬) 저장, 안전한 파일명 생성, 업로드 후 URL 반환까지 코드로 보여줘."},
  {id:47,cat:"BACK",lv:1,ko:"이메일/알림 발송",en:"Email/Notification",prompt:"[상황, 예: 가입 환영/비밀번호 재설정]에 대한 이메일 발송을 구현해줘. 템플릿 구조, 발송 라이브러리 연동, 실패 재시도, 발송 로그를 포함하고 스팸 방지 팁을 알려줘."},
  {id:48,cat:"BACK",lv:3,ko:"결제 연동",en:"Payment (Stripe)",prompt:"[Stripe 또는 토스페이먼츠] 결제를 연동해줘. 결제 세션 생성, 클라이언트 처리, 웹훅으로 결제 확정, 멱등성 처리, 환불 흐름을 코드로 보여주고 테스트 방법을 알려줘."},
  {id:49,cat:"BACK",lv:2,ko:"Rate Limiting",en:"Rate Limiting",prompt:"[API]에 요청 제한(rate limiting)을 적용해줘. 사용자/IP 기준, 슬라이딩 윈도우 알고리즘, 429 응답과 Retry-After 헤더, Redis 기반 분산 환경 대응을 코드로 제안해줘."},
  {id:50,cat:"BACK",lv:2,ko:"백엔드 단위 테스트",en:"Backend Test",prompt:"[서비스/함수]의 단위 테스트를 작성해줘. 정상 경로, 엣지 케이스, 실패 케이스를 커버하고, 외부 의존성(DB·API)은 모킹하며, 테스트 데이터 준비와 정리 방법을 보여줘."},

  /* ── DATA 🗄️ ── */
  {id:51,cat:"DATA",lv:2,ko:"DB 스키마 설계",en:"DB Schema",prompt:"[서비스]에 필요한 데이터베이스 스키마를 설계해줘. 테이블, 컬럼·타입·제약조건, 기본키·외래키, 인덱스 후보를 정의하고, 정규화와 성능 사이의 트레이드오프를 설명해줘."},
  {id:52,cat:"DATA",lv:1,ko:"SQL 쿼리 작성",en:"SQL Query",prompt:"[요구사항, 예: 최근 30일 활성 사용자별 매출 합계]을 구하는 SQL을 작성해줘. 사용한 조인·집계·필터를 설명하고, 성능을 위한 인덱스 제안과 대안 쿼리도 함께 보여줘."},
  {id:53,cat:"DATA",lv:2,ko:"마이그레이션 작성",en:"Migration",prompt:"[스키마 변경, 예: 컬럼 추가/테이블 분리]에 대한 안전한 DB 마이그레이션을 작성해줘. up/down 스크립트, 무중단 배포 고려사항, 데이터 백필 방법, 롤백 전략을 포함해줘."},
  {id:54,cat:"DATA",lv:3,ko:"인덱스 최적화",en:"Index Tuning",prompt:"느린 쿼리 [쿼리/EXPLAIN 결과]를 분석해 인덱스를 최적화해줘. 어떤 인덱스가 필요한지, 복합 인덱스 컬럼 순서, 과도한 인덱스의 부작용, 예상 개선 효과를 설명해줘."},
  {id:55,cat:"DATA",lv:1,ko:"ORM 모델(Prisma)",en:"ORM Model",prompt:"[도메인]을 Prisma 스키마로 모델링해줘. 모델·필드·관계·enum·인덱스를 정의하고, 자주 쓰는 쿼리(생성·조회·관계 포함 조회)의 예시 코드를 함께 보여줘."},
  {id:56,cat:"DATA",lv:1,ko:"시드 데이터 생성",en:"Seed Data",prompt:"[스키마]에 맞는 현실적인 시드/더미 데이터를 생성하는 스크립트를 작성해줘. 관계가 있는 데이터의 일관성을 유지하고, 개발용으로 충분한 양(예: 사용자 50명, 각 게시글 5개)을 만들어줘."},
  {id:57,cat:"DATA",lv:2,ko:"집계/리포팅 쿼리",en:"Reporting Query",prompt:"[지표, 예: 일별 신규가입·이탈·매출]을 대시보드용으로 집계하는 쿼리를 작성해줘. 날짜 그룹핑, 결측 날짜 채우기, 전기 대비 증감 계산을 포함하고 결과 형태를 예시로 보여줘."},
  {id:58,cat:"DATA",lv:2,ko:"데이터 검증 파이프라인",en:"Data Validation",prompt:"[데이터 소스, 예: CSV 업로드/외부 API]를 저장 전에 검증·정제하는 파이프라인을 설계해줘. 스키마 검증, 결측·이상치 처리, 중복 제거, 실패 레코드 격리 방법을 코드로 제안해줘."},
  {id:59,cat:"DATA",lv:2,ko:"캐싱 전략",en:"Caching (Redis)",prompt:"[읽기 부하가 큰 기능]에 Redis 캐싱을 적용해줘. 캐시 키 설계, TTL, 캐시 무효화(쓰기 시), cache-aside 패턴, 캐시 스탬피드 방지를 코드로 보여줘."},
  {id:60,cat:"DATA",lv:2,ko:"백업/복구 전략",en:"Backup & Recovery",prompt:"[DB]의 백업·복구 전략을 설계해줘. 백업 주기·보관 기간, 자동화 방법, 복구 테스트 절차, RPO/RTO 목표, 재해 상황 대응 체크리스트를 정리해줘."},

  /* ── DEBUG 🐞 ── */
  {id:61,cat:"DEBUG",lv:1,ko:"에러 메시지 분석",en:"Error Analysis",prompt:"다음 에러가 발생했어: [에러 메시지]. 가능한 원인을 확률 순으로 나열하고, 각 원인을 확인하는 방법과 가장 빠른 해결책을 알려줘. 관련 코드가 필요하면 무엇을 보여줘야 하는지 알려줘."},
  {id:62,cat:"DEBUG",lv:2,ko:"스택트레이스 해석",en:"Stack Trace",prompt:"이 스택트레이스를 해석해줘: [스택트레이스]. 어느 라인에서 실제 문제가 시작됐는지, 호출 흐름이 어떻게 되는지, 프레임워크 코드와 내 코드를 구분해서 설명하고 수정 방향을 제시해줘."},
  {id:63,cat:"DEBUG",lv:2,ko:"버그 재현 & 원인 추적",en:"Root Cause",prompt:"[버그 증상]이 간헐적으로 발생해. 재현을 위한 최소 조건을 좁히는 가설-검증 절차를 설계하고, 로그·중단점·이분 탐색(bisect)으로 원인을 추적하는 순서를 알려줘."},
  {id:64,cat:"DEBUG",lv:2,ko:"리팩터링 제안",en:"Refactoring",prompt:"다음 코드를 리팩터링해줘: [코드]. 동작은 그대로 유지하면서 가독성·중복 제거·함수 분리·네이밍을 개선하고, 변경 전후를 비교해서 왜 더 나아졌는지 설명해줘."},
  {id:65,cat:"DEBUG",lv:2,ko:"코드 리뷰",en:"Code Review",prompt:"다음 코드를 시니어 개발자 관점에서 리뷰해줘: [코드]. 버그 가능성, 보안, 성능, 가독성, 테스트 관점에서 문제를 심각도별로 정리하고, 각각 구체적인 수정 예시를 제시해줘."},
  {id:66,cat:"DEBUG",lv:3,ko:"성능 병목 진단",en:"Bottleneck",prompt:"[기능]이 느려. 병목을 찾기 위해 측정할 지점(네트워크·연산·렌더·DB)을 정하고, 프로파일링 방법과 흔한 원인별 해결책을 우선순위로 제안해줘."},
  {id:67,cat:"DEBUG",lv:3,ko:"메모리 누수 찾기",en:"Memory Leak",prompt:"[앱/서비스]에서 메모리가 계속 증가해. 누수 가능 지점(이벤트 리스너·타이머·클로저·전역 캐시)을 점검하는 체크리스트와, 힙 스냅샷으로 원인을 좁히는 방법을 알려줘."},
  {id:68,cat:"DEBUG",lv:1,ko:"로그 추가 전략",en:"Logging Strategy",prompt:"[모듈/기능]에 효과적인 로그를 추가해줘. 로그 레벨(debug/info/warn/error) 기준, 무엇을 기록하고 무엇을 기록하면 안 되는지(민감정보), 구조화 로깅 형식을 제안하고 예시를 보여줘."},
  {id:69,cat:"DEBUG",lv:2,ko:"테스트 실패 원인 분석",en:"Test Failure",prompt:"이 테스트가 실패해: [테스트 코드/에러]. 실패 원인이 테스트 문제인지 코드 문제인지 구분하고, 플레이키(불안정) 테스트라면 원인과 안정화 방법까지 제안해줘."},
  {id:70,cat:"DEBUG",lv:2,ko:"레거시 코드 이해",en:"Understand Legacy",prompt:"다음 낯선 코드를 이해하도록 도와줘: [코드]. 전체 동작을 한 문단으로 요약하고, 핵심 함수의 역할, 데이터 흐름, 위험한 부분과 손대기 전에 만들어둘 테스트를 알려줘."},

  /* ── DEPLOY 🚀 ── */
  {id:71,cat:"DEPLOY",lv:2,ko:"Dockerfile 작성",en:"Dockerfile",prompt:"[앱 스택]을 위한 프로덕션용 Dockerfile을 작성해줘. 멀티스테이지 빌드, 이미지 경량화, 비루트 사용자, 캐시 최적화, .dockerignore를 포함하고 각 단계를 주석으로 설명해줘."},
  {id:72,cat:"DEPLOY",lv:2,ko:"CI/CD 파이프라인",en:"CI/CD",prompt:"[프로젝트]의 GitHub Actions 워크플로를 작성해줘. 린트·테스트·빌드·배포 단계, 브랜치별 조건, 캐시, 시크릿 사용, 실패 시 알림을 포함한 YAML을 제시해줘."},
  {id:73,cat:"DEPLOY",lv:1,ko:"Vercel/Netlify 배포",en:"Deploy to Vercel",prompt:"[프레임워크] 앱을 [Vercel/Netlify]에 배포하는 방법을 단계별로 알려줘. 빌드 설정, 환경변수, 커스텀 도메인 연결, 프리뷰 배포, 흔한 배포 실패 원인과 해결법을 포함해줘."},
  {id:74,cat:"DEPLOY",lv:1,ko:"환경변수 관리",en:"Env Management",prompt:"[프로젝트]의 환경변수를 안전하게 관리하는 방법을 알려줘. .env 구조, 개발/스테이징/운영 분리, 시크릿 저장소 사용, 클라이언트 노출 변수 구분, .gitignore 처리를 정리해줘."},
  {id:75,cat:"DEPLOY",lv:2,ko:"도메인/HTTPS 설정",en:"Domain & HTTPS",prompt:"[서비스]에 커스텀 도메인과 HTTPS를 연결하는 방법을 알려줘. DNS 레코드(A/CNAME) 설정, SSL 인증서 발급·자동 갱신, www·apex 리다이렉트, 전파 확인 방법을 단계별로 설명해줘."},
  {id:76,cat:"DEPLOY",lv:2,ko:"모니터링/알럿",en:"Monitoring",prompt:"[운영 서비스]의 모니터링을 설계해줘. 관찰할 핵심 지표(에러율·응답시간·가동률), 로그·에러 추적 도구, 알림 임계값과 채널, 대시보드 구성을 제안해줘."},
  {id:77,cat:"DEPLOY",lv:3,ko:"무중단 배포 전략",en:"Zero-downtime",prompt:"[서비스]의 무중단 배포 전략을 설계해줘. 블루-그린과 카나리 배포를 비교하고, 헬스체크, 트래픽 전환, DB 마이그레이션과의 순서, 실패 감지 기준을 정리해줘."},
  {id:78,cat:"DEPLOY",lv:2,ko:"롤백 계획",en:"Rollback Plan",prompt:"배포 후 문제가 생겼을 때의 롤백 계획을 만들어줘. 롤백 트리거 조건, 빠른 롤백 절차, DB 변경이 포함된 경우의 처리, 사후 커뮤니케이션과 회고 항목을 정리해줘."},
  {id:79,cat:"DEPLOY",lv:3,ko:"인프라 as Code",en:"IaC (Terraform)",prompt:"[인프라 요구사항]을 Terraform으로 코드화해줘. 리소스 정의, 변수·출력, 상태 관리(원격 백엔드), 환경 분리(워크스페이스/모듈)를 예시로 보여주고 apply 전 검토 방법을 알려줘."},
  {id:80,cat:"DEPLOY",lv:1,ko:"배포 후 스모크 테스트",en:"Smoke Test",prompt:"[서비스]의 배포 직후 실행할 스모크 테스트 목록을 만들어줘. 핵심 사용자 경로, 헬스체크 엔드포인트, 외부 연동 확인 항목을 정하고, 자동화 스크립트 예시를 제시해줘."},

  /* ── AI 🤖 ── */
  {id:81,cat:"AI",lv:1,ko:"LLM 프롬프트 설계",en:"Prompt Engineering",prompt:"[작업, 예: 이메일 요약]을 잘 수행하는 LLM 프롬프트를 설계해줘. 역할·맥락·지시·제약·출력 형식을 구조화하고, few-shot 예시 포함/비포함 버전을 각각 제시하고 개선 팁을 알려줘."},
  {id:82,cat:"AI",lv:3,ko:"RAG 파이프라인",en:"RAG Pipeline",prompt:"[문서 종류]에 대한 RAG(검색 증강 생성) 파이프라인을 설계해줘. 청킹 전략, 임베딩 모델, 벡터 저장소, 검색·리랭킹, 프롬프트 조립, 환각 방지 방법을 단계별로 설명하고 예시 코드를 보여줘."},
  {id:83,cat:"AI",lv:2,ko:"챗봇 시스템 프롬프트",en:"Chatbot Prompt",prompt:"[서비스] 고객지원 챗봇의 시스템 프롬프트를 작성해줘. 역할·톤·범위·거절 규칙·안전 가이드라인을 정의하고, 모르는 질문·민감 요청·범위 밖 요청에 대한 대응 방식을 명시해줘."},
  {id:84,cat:"AI",lv:2,ko:"함수 호출/툴 정의",en:"Tool/Function Calling",prompt:"LLM이 [기능, 예: 날씨 조회/예약 생성]을 도구로 호출하도록 함수(툴) 스키마를 정의해줘. 각 툴의 이름·설명·파라미터 스키마를 작성하고, 호출 결과를 응답에 반영하는 흐름을 코드로 보여줘."},
  {id:85,cat:"AI",lv:2,ko:"임베딩 & 벡터 검색",en:"Vector Search",prompt:"[텍스트 데이터]로 의미 기반 검색을 구현해줘. 임베딩 생성, 벡터 DB 저장, 유사도 검색(코사인), top-k 반환을 코드로 보여주고, 정확도를 높이는 하이브리드 검색 팁을 알려줘."},
  {id:86,cat:"AI",lv:2,ko:"스트리밍 응답 처리",en:"Streaming Response",prompt:"LLM API의 스트리밍 응답을 프론트엔드에 실시간 표시하도록 구현해줘. 서버의 스트림 프록시, 클라이언트의 점진적 렌더링, 중단·에러 처리, 토큰 단위 표시를 코드로 제안해줘."},
  {id:87,cat:"AI",lv:2,ko:"토큰/비용 최적화",en:"Token & Cost",prompt:"[LLM 기능]의 토큰 사용량과 비용을 줄여줘. 프롬프트 압축, 컨텍스트 선택, 캐싱, 모델 라우팅(작업별 모델 분리), 출력 길이 제어 관점에서 구체적 방법과 예상 절감을 알려줘."},
  {id:88,cat:"AI",lv:3,ko:"AI 에이전트 설계",en:"AI Agent",prompt:"[목표 작업]을 자율 수행하는 AI 에이전트를 설계해줘. 계획-실행-관찰 루프, 사용할 도구, 종료 조건, 실패·무한루프 방지, 사람 확인(HITL) 지점을 정의하고 의사코드로 보여줘."},
  {id:89,cat:"AI",lv:1,ko:"이미지 생성 프롬프트",en:"Image Gen Prompt",prompt:"[원하는 이미지, 예: 앱 히어로 일러스트]를 만드는 이미지 생성 프롬프트를 작성해줘. 주제·스타일·구도·색감·조명·분위기·화질 키워드를 구조화하고, 변형 3가지와 피해야 할 요소(negative)를 제안해줘."},
  {id:90,cat:"AI",lv:3,ko:"AI 안전장치/가드레일",en:"AI Guardrails",prompt:"[LLM 기능]에 안전장치를 설계해줘. 입력 필터링(악용·주입 공격), 출력 검증, 민감정보 차단, 환각 완화, 사용량 제한, 로깅·감사 관점의 가드레일을 목록과 예시로 제안해줘."},

  /* ── GROWTH 📈 ── */
  {id:91,cat:"GROWTH",lv:1,ko:"랜딩 A/B 테스트",en:"A/B Test",prompt:"[랜딩페이지 요소, 예: 헤드라인/CTA]의 A/B 테스트를 설계해줘. 가설, 변형안 2개, 측정 지표, 최소 표본·기간 산정, 성공 판단 기준, 결과 해석 방법을 정리해줘."},
  {id:92,cat:"GROWTH",lv:2,ko:"SEO 콘텐츠 전략",en:"SEO Content",prompt:"[서비스/주제]의 SEO 콘텐츠 전략을 세워줘. 타깃 키워드(검색 의도별), 콘텐츠 클러스터 구조, 우선순위 글감 10개, 각 글의 제목·핵심 키워드·내부 링크 계획을 표로 정리해줘."},
  {id:93,cat:"GROWTH",lv:1,ko:"SNS 런칭 카피",en:"Launch Copy",prompt:"[서비스] 출시를 알리는 SNS 게시글을 작성해줘. X(트위터) 스레드, 링크드인, 인스타그램 캡션 3가지 버전으로, 각 플랫폼 톤에 맞게 후킹·핵심가치·CTA·해시태그를 포함해줘."},
  {id:94,cat:"GROWTH",lv:2,ko:"이메일 온보딩 시퀀스",en:"Email Onboarding",prompt:"신규 가입자를 위한 이메일 온보딩 시퀀스(5통)를 설계해줘. 각 이메일의 발송 시점, 목표, 제목 후보 2개, 핵심 메시지, CTA를 정리하고 이탈 방지 포인트를 알려줘."},

function Login({onClose,onLogin}){
  const[pw,setPw]=useState('');
  const[err,setErr]=useState(false);
  const go=()=>{if(pw===ADMIN_PW){onLogin();onClose();}else{setErr(true);setTimeout(()=>setErr(false),1500);}};
  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()} style={{padding:32,width:320}}>
        <div style={{fontSize:18,fontWeight:900,color:'var(--text)',marginBottom:6}}>관리자 로그인</div>
        <div style={{fontSize:12,color:'var(--sub)',marginBottom:20}}>비밀번호를 입력하세요</div>
        <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&go()} placeholder="비밀번호" autoFocus
          style={{width:'100%',padding:'10px 14px',borderRadius:8,border:`1.5px solid ${err?'#ef4444':'var(--border)'}`,background:'var(--surface-2)',color:'var(--text)',fontSize:14,outline:'none',marginBottom:err?4:14}}/>
        {err&&<div style={{fontSize:11,color:'#ef4444',marginBottom:8}}>비밀번호가 틀렸습니다</div>}

      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   FORM MODAL (Add/Edit)
══════════════════════════════════════ */
function Form({item,onClose,onSave}){
  const isEdit=!!item;
  const[ko,setKo]=useState(item?.ko||'');
  const[en,setEn]=useState(item?.en||'');
  const[cat,setCat]=useState(item?.cat||'IDEA');
  const[lv,setLv]=useState(item?.lv||1);
  const[prompt,setPr]=useState(item?.prompt||'');

  const save=()=>{
    if(!ko.trim()||!prompt.trim())return;
    onSave({
      id:item?.id||Date.now(),
      cat,lv:Number(lv),
      ko:ko.trim(),en:en.trim(),prompt:prompt.trim(),
    });
    onClose();
  };

  const labelStyle={fontSize:12,fontWeight:600,color:'var(--sub-2)',marginBottom:4,display:'block'};
  const inputStyle={width:'100%',padding:'8px 12px',borderRadius:8,border:'1.5px solid var(--border)',background:'var(--surface-2)',color:'var(--text)',fontSize:13,outline:'none',marginBottom:12};

  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()} style={{width:460,maxWidth:'92vw',maxHeight:'90vh'}}>
        <div style={{padding:'20px 24px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{fontWeight:900,fontSize:18,color:'var(--text)'}}>{isEdit?'프롬프트 편집':'새 프롬프트 추가'}</div>
          <button onClick={onClose} style={{background:'none',border:'none',fontSize:20,cursor:'pointer',color:'var(--sub)'}}>×</button>
        </div>
        <div style={{padding:'16px 24px 24px',overflow:'auto'}}>
          <div style={{display:'flex',gap:12}}>
            <div style={{flex:1}}>
              <label style={labelStyle}>카테고리</label>
              <select value={cat} onChange={e=>setCat(e.target.value)} style={{...inputStyle,cursor:'pointer'}}>
                {CAT_IN.map(c=><option key={c} value={c}>{CAT_EMOJI[c]} {CAT_KO[c]}</option>)}
              </select>
            </div>
            <div style={{width:130}}>
              <label style={labelStyle}>난이도</label>
              <select value={lv} onChange={e=>setLv(e.target.value)} style={{...inputStyle,cursor:'pointer'}}>
                <option value={1}>초급</option>
                <option value={2}>중급</option>
                <option value={3}>고급</option>
              </select>
            </div>
          </div>
          <label style={labelStyle}>한글 제목</label>
          <input value={ko} onChange={e=>setKo(e.target.value)} placeholder="예: PRD 작성" style={inputStyle}/>
          <label style={labelStyle}>영문 부제</label>
          <input value={en} onChange={e=>setEn(e.target.value)} placeholder="예: Write a PRD" style={inputStyle}/>
          <label style={labelStyle}>프롬프트</label>
          <textarea value={prompt} onChange={e=>setPr(e.target.value)} placeholder="복사해서 바로 쓸 프롬프트 본문. [플레이스홀더]로 변수를 표시하세요." rows={6} style={{...inputStyle,resize:'vertical',lineHeight:1.6}}/>
          <button onClick={save} style={{width:'100%',padding:'11px 0',borderRadius:8,border:'none',background:'var(--accent)',color:'var(--accent-text)',fontWeight:700,fontSize:14,cursor:'pointer',marginTop:4}}>
            {isEdit?'수정 완료':'추가하기'}
          </button>
        </div>
      </div>
    </div>
  );
}

  const[copied,setCopied]=useState(null);
  const[detail,setDetail]=useState(null);
  const[login,setLogin]=useState(false);
  const[form,setForm]=useState(false);
  const[editItem,setEditItem]=useState(null);
  const[toast,setToast]=useState({msg:'',vis:false});
  const[theme,setTheme]=useState(null);        // null=아직 미결정(첫 화면 판단 전)
  const[showSelect,setShowSelect]=useState(false); // 디자인 선택 화면 표시 여부
  const importRef=useRef(null);

  const tst=msg=>{setToast({msg,vis:true});setTimeout(()=>setToast(t=>({...t,vis:false})),2200);};
  const copyText=t=>{if(navigator.clipboard){navigator.clipboard.writeText(t);}else{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);}};

  // Load
  useEffect(()=>{
    const saved=lsLoad(EDITS_KEY);
    setStyles(saved&&Array.isArray(saved)&&saved.length?saved:DEFAULTS);
    const f=lsLoad(FAVS_KEY);
    if(f&&Array.isArray(f))setFavs(new Set(f));
    // 디자인: 저장된 선택이 있으면 적용, 없으면 선택 화면을 먼저 보여줌
    const savedTheme=lsLoad(THEME_KEY);
    if(savedTheme&&THEMES.some(t=>t.id===savedTheme)){setTheme(savedTheme);applyTheme(savedTheme);}
    else{setShowSelect(true);}
  },[]);

  // 디자인 선택 확정
  const pickTheme=id=>{
    setTheme(id);applyTheme(id);lsSave(THEME_KEY,id);
    setShowSelect(false);
    if(location.hash!=='#content')location.hash='content';
    tst('🎨 디자인이 적용되었습니다');
  };

  // Persist
  useEffect(()=>{if(styles)lsSave(EDITS_KEY,styles);},[styles]);
  useEffect(()=>{lsSave(FAVS_KEY,[...favs]);},[favs]);

  const toggleFav=id=>setFavs(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n;});
  const doCopy=s=>{copyText(s.prompt);setCopied(s.id);tst('✓ 프롬프트가 복사되었습니다');setTimeout(()=>setCopied(null),2000);};
  const doSave=d=>{
    const exists=styles.find(s=>s.id===d.id);
    if(exists){setStyles(p=>p.map(s=>s.id===d.id?{...s,...d}:s));}
    else{setStyles(p=>[d,...p]);}
    tst(exists?'✅ 수정되었습니다':'✅ 추가되었습니다');
  };
  const doDel=id=>{if(!window.confirm('정말 삭제하시겠습니까?'))return;setStyles(p=>p.filter(s=>s.id!==id));tst('삭제되었습니다');};
  const doExport=()=>{const b=new Blob([JSON.stringify(styles,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vibe-prompt-100.json';a.click();URL.revokeObjectURL(a.href);tst('📦 내보내기 완료');};
  const doImport=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(Array.isArray(d)){setStyles(d);tst('✅ '+d.length+'개 가져오기 완료');}}catch(e){tst('⚠️ JSON 형식 오류');}e.target.value='';};r.readAsText(f);};
  const doReset=()=>{if(!window.confirm('기본 100개 프롬프트로 초기화할까요? 편집 내용이 사라집니다.'))return;setStyles(DEFAULTS);tst('기본값으로 초기화되었습니다');};

  if(styles===null)return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'var(--sub)',fontSize:14}}>불러오는 중...</div>;

  // 첫 실행: 디자인 선택 화면
  if(showSelect)return <DesignSelect current={theme} onPick={pickTheme}/>;

  const filtered=styles.filter(s=>{
    if(active==='FAVORITES'&&!favs.has(s.id))return false;
    if(active!=='ALL'&&active!=='FAVORITES'&&s.cat!==active)return false;
    if(q){
      const t=q.toLowerCase();
      if(!s.ko.toLowerCase().includes(t)&&!(s.en||'').toLowerCase().includes(t)&&!s.prompt.toLowerCase().includes(t))return false;
    }
    return true;
  });

  return(
    <div style={{minHeight:'100vh',background:'var(--bg)'}}>
      {/* HEADER */}
      <header style={{background:'var(--surface)',borderBottom:'1px solid var(--border)',position:'sticky',top:0,zIndex:100}}>
        <div className="header-inner" style={{maxWidth:1280,margin:'0 auto',padding:'14px 24px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:16}}>
          {/* Logo */}
          <div style={{display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
            <span style={{fontSize:20}}>⚡</span>
            <div>
              <div style={{fontWeight:900,fontSize:16,color:'var(--text)',letterSpacing:'-0.5px',lineHeight:1}}>VIBE PROMPT 100</div>
              <div style={{fontSize:10,color:'var(--sub)',fontFamily:"'IBM Plex Mono',monospace",letterSpacing:'.5px'}}>바이브 코딩 프롬프트 라이브러리</div>
            </div>
          </div>

          {/* Search */}
          <div className="search-wrap">
            {I.search}
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="프롬프트 검색..."/>
          </div>

          {/* Right buttons */}
          <div style={{display:'flex',gap:6,flexShrink:0}}>
            <button className="admin-btn" onClick={()=>setShowSelect(true)}>🎨 디자인</button>
            <button className="admin-btn" onClick={()=>{copyText(SITE_URL);tst('✓ URL 복사됨');}}>{I.link} URL 복사</button>
            {admin?(
              <>
                <button className="admin-btn" onClick={()=>{setEditItem(null);setForm(true);}}>{I.plus} 추가</button>
                <button className="admin-btn" onClick={doExport}>{I.dl} 내보내기</button>
                <label className="admin-btn" style={{cursor:'pointer'}}>{I.ul} 가져오기<input ref={importRef} type="file" accept=".json" onChange={doImport} style={{display:'none'}}/></label>
                <button className="admin-btn" onClick={doReset}>↺ 초기화</button>
                <button className="admin-btn" onClick={()=>setAdmin(false)} style={{color:'#ef4444'}}>🔓 로그아웃</button>
              </>
            ):(
              <button className="admin-btn" onClick={()=>setLogin(true)}>{I.lock} 관리자</button>
            )}
          </div>
        </div>

        {/* Category tabs */}
        <div style={{maxWidth:1280,margin:'0 auto',padding:'0 24px 12px',display:'flex',gap:6,overflowX:'auto'}} className="tab-row">
          {CATS.map(c=>(
            <button key={c} className={`tab-btn${active===c?' active':''}`} onClick={()=>setActive(c)}>
              {c==='ALL'?`전체 (${styles.length})`:c==='FAVORITES'?`♥ 즐겨찾기 (${[...favs].filter(id=>styles.some(s=>s.id===id)).length})`:`${CAT_EMOJI[c]||''} ${CAT_KO[c]||c}`}
            </button>
          ))}
        </div>
      </header>

      {/* GRID */}
      <main style={{maxWidth:1280,margin:'0 auto',padding:'20px 24px 40px'}}>
        {filtered.length===0?(
          <div style={{textAlign:'center',padding:'80px 0'}}>
            <div style={{fontSize:40,marginBottom:12,opacity:.15}}>{active==='FAVORITES'?'♡':'🔍'}</div>
            <div style={{color:'var(--sub)',fontSize:14}}>{active==='FAVORITES'?'즐겨찾기한 프롬프트가 없습니다':'검색 결과가 없습니다'}</div>
          </div>
        ):(
          <div className="grid-4" style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(265px,1fr))',gap:18}}>
            {filtered.map((s,i)=>(
              <div key={s.id} className="card-enter" style={{animationDelay:`${Math.min(i,20)*.03}s`}}>
                <Card s={s} fav={favs.has(s.id)} admin={admin} onFav={toggleFav} onCopy={doCopy} copied={copied} onView={setDetail} onEdit={s=>{setEditItem(s);setForm(true);}} onDel={doDel}/>
              </div>
            ))}
          </div>
        )}
      </main>

      {/* FOOTER */}
      <footer style={{textAlign:'center',padding:'16px 0 28px',borderTop:'1px solid var(--border)',color:'var(--sub)',fontSize:11,fontFamily:"'IBM Plex Mono',monospace",background:'var(--surface)'}}>
        Vibe Prompt 100 — {styles.length} prompts · 복사해서 바로 쓰는 바이브 코딩 프롬프트
      </footer>

      {/* MODALS */}
      {detail&&<Detail s={detail} onClose={()=>setDetail(null)} onCopy={doCopy} copied={copied}/>}
      {login&&<Login onClose={()=>setLogin(false)} onLogin={()=>{setAdmin(true);tst('관리자 모드 활성화');}}/>}
      {form&&admin&&<Form item={editItem} onClose={()=>{setForm(false);setEditItem(null);}} onSave={doSave}/>}
      <Toast msg={toast.msg} vis={toast.vis}/>
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
